# Runs the tests, then publishes the web app to GitHub Pages on every push to main.
# One-time setup in the repository: Settings > Pages > Source: "GitHub Actions".
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run tests
        run: dotnet test tests/PokerToolkit.Engine.Tests

      - name: Publish
        run: dotnet publish src/PokerToolkit.Web -c Release -o publish

      # A project site lives at username.github.io/<repo>/, so links must start there.
      - name: Point the app at the repository path
        run: sed -i 's|<base href="/" />|<base href="/${{ github.event.repository.name }}/" />|' publish/wwwroot/index.html

      # Lets a refresh on /ranges or /odds load the app instead of a 404,
      # and stops GitHub from hiding the _framework folder.
      - name: Add GitHub Pages helpers
        run: |
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
